<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pursuit</title>
<meta name="description" content="Chart your path to studying abroad — track Masters & PhD applications and scholarships.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e7ebf1;
  --border:#e2e7ee; --border-strong:#ccd4df;
  --fg:#181d26; --fg-2:#56606f; --muted:#8a93a2;
  --accent:#4f5bd5; --accent-fg:#ffffff; --accent-soft:rgba(79,91,213,.10);
  --ok:#1f9d6b; --ok-bg:rgba(31,157,107,.12);
  --warn:#bd7710; --warn-bg:rgba(189,119,16,.13);
  --bad:#d2483f; --bad-bg:rgba(210,72,63,.12);
  --info:#2f6fd0; --info-bg:rgba(47,111,208,.12);
  --applied:#6d5ae0; --applied-bg:rgba(109,90,224,.13);
  --slate:#6b7280; --slate-bg:rgba(107,114,128,.12);
  --orange:#d9772e; --orange-bg:rgba(217,119,46,.13);
  --shadow:0 1px 2px rgba(20,28,40,.04),0 2px 8px rgba(20,28,40,.05);
  --shadow-lg:0 8px 30px rgba(20,28,40,.14);
  --radius:14px; --radius-sm:9px;
  --font-head:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b23; --surface-2:#1d232d; --surface-3:#242b36;
  --border:#262d39; --border-strong:#39424f;
  --fg:#e9ecf1; --fg-2:#a6afbd; --muted:#717b8a;
  --accent:#8b95f0; --accent-fg:#13151f; --accent-soft:rgba(139,149,240,.15);
  --ok:#3bbd87; --ok-bg:rgba(59,189,135,.15);
  --warn:#e0a44a; --warn-bg:rgba(224,164,74,.15);
  --bad:#ef6b61; --bad-bg:rgba(239,107,97,.15);
  --info:#5b9af0; --info-bg:rgba(91,154,240,.15);
  --applied:#9b8bf0; --applied-bg:rgba(155,139,240,.16);
  --slate:#9aa3b2; --slate-bg:rgba(154,163,178,.15);
  --orange:#eb9a5a; --orange-bg:rgba(235,154,90,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 10px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b23; --surface-2:#1d232d; --surface-3:#242b36;
  --border:#262d39; --border-strong:#39424f;
  --fg:#e9ecf1; --fg-2:#a6afbd; --muted:#717b8a;
  --accent:#8b95f0; --accent-fg:#13151f; --accent-soft:rgba(139,149,240,.15);
  --ok:#3bbd87; --ok-bg:rgba(59,189,135,.15);
  --warn:#e0a44a; --warn-bg:rgba(224,164,74,.15);
  --bad:#ef6b61; --bad-bg:rgba(239,107,97,.15);
  --info:#5b9af0; --info-bg:rgba(91,154,240,.15);
  --applied:#9b8bf0; --applied-bg:rgba(155,139,240,.16);
  --slate:#9aa3b2; --slate-bg:rgba(154,163,178,.15);
  --orange:#eb9a5a; --orange-bg:rgba(235,154,90,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 10px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.tnum{font-variant-numeric:tabular-nums}
.ti{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;line-height:1;flex-shrink:0;vertical-align:-.125em}
.ti svg{width:1em;height:1em;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.ti-loader svg{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.ti-loader svg{animation:none}}

.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--applied));display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:19px}
.brand h1{font-size:18px;font-weight:600;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.top-sp{flex:1}
.chip-user{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.chip-user .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:11px;font-family:var(--font-head)}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg-2);display:grid;place-items:center;font-size:17px}
.icon-btn:hover{color:var(--fg);border-color:var(--border-strong)}

.dash{padding-top:18px}
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);min-width:0}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.stat .v{font-family:var(--font-head);font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.stat .vsub{font-size:11.5px;color:var(--fg-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.hl{background:linear-gradient(150deg,var(--accent-soft),transparent);border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}

.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;background:none;border:none;border-bottom:2px solid transparent;color:var(--fg-2);font-size:14px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px;margin-bottom:-1px}
.tab .ti{font-size:17px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{font-size:11px;background:var(--surface-3);color:var(--fg-2);border-radius:999px;padding:1px 7px;font-weight:600}
.tab.on .cnt{background:var(--accent-soft);color:var(--accent)}

.panel{padding:18px 0 60px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border:none;background:none;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
select.ctl,input.ctl{font-family:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);border-radius:9px}
select.ctl:focus,input.ctl:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.ctl-sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-size:13px;font-weight:600}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn .ti{font-size:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:13px}
.uni{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.uni-top{padding:14px 15px 12px;display:flex;flex-direction:column;gap:9px}
.uni-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.flag{font-size:12px;font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:6px;letter-spacing:.02em;flex-wrap:wrap}
.flag .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.uni h3{font-size:16px;font-weight:600;line-height:1.25}
.uni .prog{font-size:13px;color:var(--fg-2);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;letter-spacing:.01em}
.pill-slate{background:var(--slate-bg);color:var(--slate)} .pill-info{background:var(--info-bg);color:var(--info)}
.pill-warn{background:var(--warn-bg);color:var(--warn)} .pill-applied{background:var(--applied-bg);color:var(--applied)}
.pill-ok{background:var(--ok-bg);color:var(--ok)} .pill-bad{background:var(--bad-bg);color:var(--bad)}
.pill-orange{background:var(--orange-bg);color:var(--orange)}
.win{display:flex;gap:0;padding:0 15px 12px}
.win-cell{flex:1;min-width:0}
.win-cell .wl{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:4px}
.win-cell .wv{font-size:13px;font-weight:600;margin-top:2px}
.win-div{width:1px;background:var(--border);margin:2px 14px}
.metarow{display:flex;flex-wrap:wrap;gap:4px 16px;padding:0 15px 13px}
.meta{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:5px}
.meta .ti{font-size:14px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.dl-soon{color:var(--bad)} .dl-near{color:var(--warn)} .dl-ok{color:var(--fg-2)} .dl-open{color:var(--ok)}
.uni-foot{margin-top:auto;border-top:1px solid var(--border);display:flex;align-items:stretch;background:var(--surface-2)}
.uni-foot select{flex:1;border:none;background:none;color:var(--fg);font-family:inherit;font-size:12.5px;font-weight:600;padding:10px 12px}
.uni-foot select:focus{outline:2px solid var(--accent-soft);outline-offset:-2px}
.foot-btn{border:none;border-left:1px solid var(--border);background:none;color:var(--fg-2);padding:0 13px;font-size:16px;display:grid;place-items:center}
.foot-btn:hover{color:var(--fg);background:var(--surface-3)}
.foot-btn.danger:hover{color:var(--bad)}
.verify{font-size:10.5px;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:999px;font-weight:600}

.detail{border-top:1px solid var(--border);padding:13px 15px;display:none;flex-direction:column;gap:13px;background:var(--surface)}
.detail.open{display:flex}
.lbl-mini{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.detail-grid{display:flex;flex-direction:column;gap:7px}
.elig-note{font-size:12.5px;color:var(--fg-2);line-height:1.5}
.reqs{display:flex;flex-direction:column;gap:4px}
.reqitem{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--fg);padding:5px 8px;border-radius:8px;background:var(--surface-2);line-height:1.45}
.reqitem input{accent-color:var(--accent);width:15px;height:15px;margin:2px 0 0;flex-shrink:0}
.reqitem.met{color:var(--fg-2)}
.reqitem.met span{text-decoration:line-through;text-decoration-color:var(--muted)}
.docs-row{display:flex;flex-wrap:wrap;gap:6px}
.docchk{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg-2);font-weight:500}
.docchk input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.docchk.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.note-area{width:100%;min-height:56px;resize:vertical;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px}
.note-area:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.applink{font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:5px;word-break:break-all}
.applink:hover{text-decoration:underline}

.empty{text-align:center;padding:48px 20px;color:var(--fg-2)}
.empty .ti{font-size:40px;color:var(--muted)}
.empty h3{font-size:17px;margin:12px 0 5px;color:var(--fg)}
.empty p{font-size:13.5px;max-width:440px;margin:0 auto 16px}
.note-bar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--warn);background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);padding:8px 13px;border-radius:9px;margin-bottom:14px}
.note-bar.err{color:var(--bad);background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.skel{height:168px;border-radius:var(--radius);background:linear-gradient(100deg,var(--surface-2) 30%,var(--surface-3) 50%,var(--surface-2) 70%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

.sch{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px;display:flex;flex-direction:column;gap:9px}
.sch-cover{font-size:12.5px;color:var(--fg-2);line-height:1.5}
.sch-foot{display:flex;align-items:center;gap:8px;margin-top:2px}
.sch-foot select{flex:1;font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 10px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);border-radius:8px}

.docmaster{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.doccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.doccard h3{font-size:15px;display:flex;align-items:center;gap:8px}
.doccard p{font-size:12.5px;color:var(--fg-2);margin:7px 0 0;line-height:1.5}
.doccard .status{margin-top:11px}

.prof{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:600}
.prow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.prow:last-child{border-bottom:none}
.prow .pl{color:var(--fg-2)} .prow .pv{font-weight:600;text-align:right}
.taglist{display:flex;flex-wrap:wrap;gap:7px}
.ctag{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg-2)}
.summary{font-size:13.5px;color:var(--fg-2);line-height:1.6}

.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;margin:auto}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-size:16px}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--fg-2)}
.field input,.field select,.field textarea{font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);border-radius:9px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.modal-f{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-lg);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}

@media (max-width:860px){ .stat-grid{grid-template-columns:repeat(3,1fr)} .prof{grid-template-columns:1fr} }
@media (max-width:520px){ .stat-grid{grid-template-columns:repeat(2,1fr)} .brand .sub{display:none} .field-row,.field-row-3{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="top">
  <div class="wrap top-in">
    <div class="brand">
      <div class="logo"><i class="ti ti-peak"></i></div>
      <div style="min-width:0"><h1>Pursuit</h1><div class="sub">The pursuit of what's next — study, scholarships, career</div></div>
    </div>
    <div class="top-sp"></div>
    <div id="userChip" class="chip-user" hidden><span class="av" id="userAv">A</span><span id="userName">You</span></div>
    <button class="icon-btn" id="refreshBtn" title="Refresh from database" aria-label="Refresh"><i class="ti ti-refresh"></i></button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><i class="ti ti-moon"></i></button>
  </div>
</div>

<div class="wrap">
  <div id="noteBar" class="note-bar" hidden><i class="ti ti-info-circle"></i><span id="noteBarTxt"></span></div>

  <div class="dash"><div class="stat-grid" id="statGrid"></div></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="universities"><i class="ti ti-building-bank"></i><span>Universities</span><span class="cnt" id="cUni">0</span></button>
    <button class="tab" data-tab="scholarships"><i class="ti ti-award"></i><span>Scholarships</span><span class="cnt" id="cSch">0</span></button>
    <button class="tab" data-tab="documents"><i class="ti ti-folder"></i><span>Documents</span></button>
    <button class="tab" data-tab="profile"><i class="ti ti-user"></i><span>Profile</span></button>
  </div>

  <div class="panel" id="panel-universities">
    <div class="controls">
      <div class="seg" id="degSeg">
        <button data-deg="all" class="on">All</button>
        <button data-deg="Masters">Masters</button>
        <button data-deg="PhD">PhD</button>
      </div>
      <select class="ctl" id="fCountry"><option value="all">All countries</option></select>
      <select class="ctl" id="fIntake"><option value="all">All intakes</option></select>
      <select class="ctl" id="fStatus">
        <option value="all">All statuses</option>
        <option value="not_started">Not started</option>
        <option value="researching">Researching</option>
        <option value="docs_ready">Docs ready</option>
        <option value="applied">Applied</option>
        <option value="admitted">Admitted</option>
        <option value="waitlisted">Waitlisted</option>
        <option value="rejected">Rejected</option>
      </select>
      <select class="ctl" id="fSort">
        <option value="deadline">Sort: Closing date</option>
        <option value="opening">Sort: Opening date</option>
        <option value="priority">Sort: Priority</option>
        <option value="country">Sort: Country</option>
        <option value="status">Sort: Status</option>
        <option value="name">Sort: Name</option>
      </select>
      <div class="ctl-sp"></div>
      <button class="btn primary" id="addUniBtn"><i class="ti ti-plus"></i>Add program</button>
    </div>
    <div id="uniHost"></div>
  </div>

  <div class="panel" id="panel-scholarships" hidden>
    <div class="controls">
      <select class="ctl" id="fSchCountry"><option value="all">All countries</option></select>
      <select class="ctl" id="fSchStatus">
        <option value="all">All statuses</option>
        <option value="not_started">Not started</option>

async function loadAll(isManual){
  if(!sb){showNote("Supabase client couldn't load. Check your internet connection and refresh.",true);renderAll();return;}
  if(isManual)toast("Refreshing…");
  try{
    const [p,s,pr]=await Promise.all([
      sb.from("programs").select("*"),
      sb.from("scholarships").select("*"),
      sb.from("profile").select("*").eq("id","me").maybeSingle(),
    ]);
    if(p.error)throw p.error;
    if(s.error)throw s.error;
    unis=p.data||[]; schols=s.data||[]; profile=(pr&&pr.data)?pr.data.data:null;
    loaded=true; hideNote(); renderAll();
    if(profile&&profile.name){$("#userName").textContent=String(profile.name).split(" ")[0];$("#userAv").textContent=(profile.name[0]||"A").toUpperCase();$("#userChip").hidden=false;}
    if(isManual)toast("Up to date");
  }catch(err){
    loaded=true;
    const m=(err&&err.message)||"unknown error";
    if(/relation|does not exist|schema cache|not find the table/i.test(m)) showNote("Database tables not found. Run supabase_setup.sql in your Supabase SQL editor, then refresh.",true);
    else showNote("Couldn't reach the database: "+m,true);
    renderAll();
  }
}
function showNote(m,isErr){$("#noteBarTxt").textContent=m;$("#noteBar").className="note-bar"+(isErr?" err":"");$("#noteBar").hidden=false;}
function hideNote(){$("#noteBar").hidden=true;}

/* ============ helpers ============ */
function daysLeft(d){if(!d)return null;const t=new Date(d+"T00:00:00");const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function fmtDate(d){if(!d)return "—";const dt=new Date(d+"T00:00:00");if(isNaN(dt))return "—";return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
function closeClass(n){if(n==null)return "dl-ok";if(n<0)return "dl-soon";if(n<=30)return "dl-soon";if(n<=75)return "dl-near";return "dl-ok";}
function closeText(n){if(n==null)return "No date";if(n<0)return "Closed";if(n===0)return "Closes today";return "Closes in "+n+"d";}
function openText(n){if(n==null)return "";if(n>0)return "Opens in "+n+"d";return "Open now";}

function setOpts(sel,allLabel,vals){const el=$(sel);const cur=el.value;el.innerHTML='<option value="all">'+allLabel+"</option>"+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");el.value=vals.includes(cur)?cur:"all";}

function updateStats(){
  $("#cUni").textContent=unis.length; $("#cSch").textContent=schols.length;
  const applied=unis.filter(u=>["applied","admitted","waitlisted","rejected"].includes(u.status)).length;
  const admitted=unis.filter(u=>u.status==="admitted").length;
  const eligible=unis.filter(u=>u.eligibility==="match").length;
  const schApplied=schols.filter(s=>["applied","awarded"].includes(s.status)).length;
  const upcoming=unis.map(u=>({u,n:daysLeft(u.close_date)})).filter(x=>x.n!=null&&x.n>=0&&!["applied","admitted","rejected","waitlisted"].includes(x.u.status)).sort((a,b)=>a.n-b.n);
  const next=upcoming[0];
  const tiles=[
    {k:"Programs",ti:"building-bank",v:unis.length,sub:`${unis.filter(u=>u.degree==="Masters").length} MSc · ${unis.filter(u=>u.degree==="PhD").length} PhD`},
    {k:"Applied",ti:"send",v:applied,sub:`of ${unis.length}`},
    {k:"Admitted",ti:"circle-check",v:admitted,sub:admitted?"congratulations!":"in progress"},
    {k:"Eligible",ti:"user-check",v:eligible,sub:"clear matches"},
    {k:"Scholarships",ti:"award",v:`${schApplied}/${schols.length}`,sub:"applied"},
    {k:"Next to close",ti:"clock",v:next?(next.n+"d"):"—",sub:next?esc(next.u.name):"nothing pending",hl:true},
  ];
  $("#statGrid").innerHTML=tiles.map(t=>`<div class="stat${t.hl?" hl":""}"><div class="k"><i class="ti ti-${t.ti}"></i>${t.k}</div><div class="v tnum">${t.v}</div><div class="vsub">${t.sub}</div></div>`).join("");
  renderIcons($("#statGrid"));
}

function sortUnis(list){
  const s=$("#fSort").value,arr=[...list];
  const byDate=f=>(a,b)=>{const x=daysLeft(a[f]),y=daysLeft(b[f]);if(x==null)return 1;if(y==null)return -1;return x-y;};
  if(s==="deadline")arr.sort(byDate("close_date"));
  else if(s==="opening")arr.sort(byDate("open_date"));
  else if(s==="priority"){const o={high:0,medium:1,low:2};arr.sort((a,b)=>(o[a.priority]??3)-(o[b.priority]??3));}
  else if(s==="country")arr.sort((a,b)=>(a.country||"").localeCompare(b.country||"")||(a.name||"").localeCompare(b.name||""));
  else if(s==="status")arr.sort((a,b)=>UNI_STATUS_ORDER.indexOf(a.status)-UNI_STATUS_ORDER.indexOf(b.status));
  else if(s==="name")arr.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  return arr;
}

  host.innerHTML='<div class="grid">'+list.map(uniCard).join("")+"</div>";renderIcons(host);

    </div>
    <div class="win">
      <div class="win-cell"><div class="wl"><i class="ti ti-calendar-up"></i>Opens</div><div class="wv tnum">${fmtDate(u.open_date)}</div></div>
      <div class="win-div"></div>
      <div class="win-cell"><div class="wl"><i class="ti ti-calendar-event"></i>Closes</div><div class="wv tnum ${closeClass(nc)}">${fmtDate(u.close_date)}</div></div>
    </div>
    <div class="metarow">
      <span class="meta ${closeClass(nc)}" style="font-weight:600"><i class="ti ti-clock"></i>${closeText(nc)}</span>

      <div class="detail-grid"><span class="lbl-mini">Documents for this program</span><div class="docs-row">${DOC_KEYS.map(([k,lb])=>`<label class="docchk${docs[k]?" done":""}"><input type="checkbox" data-doc="${k}"${docs[k]?" checked":""}>${lb}</label>`).join("")}</div></div>

  const host=$("#schHost");
  if(!loaded){host.innerHTML='<div class="grid">'+Array(3).fill('<div class="skel"></div>').join("")+"</div>";return;}
  if(!schols.length){host.innerHTML=`<div class="empty"><i class="ti ti-award"></i><h3>No scholarships yet</h3><p>Load a starter set matched to your target countries — OeAD, Erasmus Mundus, Stipendium Hungaricum and more.</p><button class="btn primary" id="importSchBtn"><i class="ti ti-download"></i>Import recommended scholarships</button></div>`;const b=$("#importSchBtn");if(b)b.onclick=importSchCatalog;renderIcons(host);return;}
  const cQ=$("#fSchCountry").value,sQ=$("#fSchStatus").value;
  let list=schols.filter(s=>(cQ==="all"||s.country===cQ)&&(sQ==="all"||(s.status||"not_started")===sQ));
  list.sort((a,b)=>{const x=daysLeft(a.deadline),y=daysLeft(b.deadline);if(x==null)return 1;if(y==null)return -1;return x-y;});
  if(!list.length){host.innerHTML=`<div class="empty"><i class="ti ti-filter-off"></i><h3>Nothing matches</h3><p>No scholarships match these filters.</p></div>`;renderIcons(host);return;}
  host.innerHTML='<div class="grid">'+list.map(schCard).join("")+"</div>";renderIcons(host);
}
function schCard(s){
  const st=SCH_STATUS[s.status||"not_started"],nc=daysLeft(s.deadline),no=daysLeft(s.open_date);
  const opts=Object.keys(SCH_STATUS).map(k=>`<option value="${k}"${(s.status||"not_started")===k?" selected":""}>${SCH_STATUS[k].label}</option>`).join("");
  return `<div class="sch" data-id="${esc(s.id)}">
    <div class="uni-head"><div style="min-width:0"><div class="flag"><span class="dot"></span>${esc(s.country||"")}${s.verify?' <span class="verify">verify</span>':""}</div><h3 style="font-size:15.5px;margin-top:4px">${esc(s.name||"")}</h3></div><span class="bdg ${st.cls}">${st.label}</span></div>
    <div class="sch-cover">${esc(s.cover||"")}</div>
    <div class="win">
      <div class="win-cell"><div class="wl"><i class="ti ti-calendar-up"></i>Opens</div><div class="wv tnum">${fmtDate(s.open_date)}</div></div>
      <div class="win-div"></div>
      <div class="win-cell"><div class="wl"><i class="ti ti-calendar-event"></i>Deadline</div><div class="wv tnum ${closeClass(nc)}">${fmtDate(s.deadline)}</div></div>
    </div>
    <span class="meta ${closeClass(nc)}" style="font-weight:600"><i class="ti ti-clock"></i>${closeText(nc)}</span>
    ${s.link?`<a class="applink" href="${esc(s.link)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Scholarship page</a>`:""}
    <div class="sch-foot"><select data-sstatus>${opts}</select><button class="foot-btn danger" data-sdel title="Remove" style="border:1px solid var(--border);border-radius:8px;height:34px;width:38px"><i class="ti ti-trash"></i></button></div>
  </div>`;
}
$("#schHost").addEventListener("change",e=>{const card=e.target.closest(".sch");if(!card)return;if(e.target.matches("[data-sstatus]")){writeSch(card.dataset.id,{status:e.target.value});toast("Updated");}});
$("#schHost").addEventListener("click",e=>{const card=e.target.closest(".sch");if(!card)return;if(e.target.closest("[data-sdel]"))delSch(card.dataset.id);});

/* ============ documents ============ */
function renderDocs(){
  $("#docHost").innerHTML=DOC_MASTER.map(d=>{const total=unis.length,have=unis.filter(u=>(u.docs||{})[d.id]).length,pct=total?Math.round(have/total*100):0;
    return `<div class="doccard"><h3><i class="ti ti-${d.icon}" style="color:var(--accent)"></i>${esc(d.name)}</h3><p>${esc(d.desc)}</p><div class="status"><span class="bdg ${pct===100&&total?"pill-ok":pct>0?"pill-warn":"pill-slate"}">${total?`Ready for ${have}/${total} programs`:"Add programs first"}</span></div></div>`;}).join("");
  renderIcons($("#docHost"));
}

/* ============ profile ============ */
function renderProfile(){
  const p=profile||{};const countries=p.countries&&p.countries.length?p.countries:["Austria","Netherlands","Finland","Sweden","USA","Canada","Hungary"];
  $("#profHost").innerHTML=`
    <div class="card"><h3>Applicant profile</h3>
      <div class="prow"><span class="pl">Name</span><span class="pv">${esc(p.name||"Mohammed Asfakul Ghani")}</span></div>
      <div class="prow"><span class="pl">Degree target</span><span class="pv">${esc(p.degreeTarget||"Masters (open to PhD)")}</span></div>
      <div class="prow"><span class="pl">Field</span><span class="pv">${esc(p.field||"Computer Science / Software Engineering")}</span></div>
      <div class="prow"><span class="pl">Bachelor's GPA</span><span class="pv tnum">${esc(p.gpa||"3.44 / 4.00")}</span></div>
      <div class="prow"><span class="pl">IELTS</span><span class="pv tnum">${esc(p.ielts||"6.5")}</span></div>
      <div class="prow"><span class="pl">Experience</span><span class="pv">${esc(p.experience||"5+ yrs · Software Engineer (Lead)")}</span></div>
      <div style="margin-top:16px"><span class="lbl-mini">Target countries</span><div class="taglist" style="margin-top:9px">${countries.map(c=>`<span class="ctag">${esc(c)}</span>`).join("")}</div></div>
    </div>
    <div class="card"><h3>How your profile reads to admissions</h3>
      <div class="summary">${esc(p.summary||"Backend engineer with 5+ years in Java, Spring Boot and microservices, leading a team of 6 and shipping systems at scale. ICPC regional finalist with strong competitive-programming ratings. This industry depth and algorithmic background are real differentiators for master's admissions; the 3.44 GPA is solid but not exceptional, so let the experience and ICPC record carry the statement. For funded PhD routes, a research fit with specific faculty matters more than coursework grades.")}</div>
      <div style="margin-top:16px"><span class="lbl-mini">Strengths to lead with</span><div class="taglist" style="margin-top:9px"><span class="ctag">5+ yrs industry</span><span class="ctag">ICPC finalist</span><span class="ctag">System design at scale</span><span class="ctag">Team leadership</span><span class="ctag">CI/CD &amp; cloud</span></div></div>
    </div>`;
  renderIcons($("#profHost"));
}

/* ============ uni modal ============ */
let editId=null;
function openUniModal(u){
  editId=u?u.id:null;$("#uniModalTitle").textContent=u?"Edit program":"Add program";
  $("#mName").value=u?u.name||"":"";$("#mProg").value=u?u.program||"":"";$("#mCountry").value=u?u.country||"":"";
  $("#mDeg").value=u?u.degree||"Masters":"Masters";$("#mOpen").value=u?u.open_date||"":"";$("#mClose").value=u?u.close_date||"":"";
  $("#mIntake").value=u?u.intake||"":"";$("#mTuition").value=u?u.tuition||"":"";$("#mIelts").value=u?u.ielts||"":"";
  $("#mPrio").value=u?u.priority||"medium":"medium";$("#mElig").value=u?u.eligibility||"match":"match";
  $("#mReqs").value=u&&Array.isArray(u.requirements)?u.requirements.join("\n"):"";$("#mLink").value=u?u.link||"":"";
  $("#uniOverlay").classList.add("open");
}
function closeUni(){$("#uniOverlay").classList.remove("open");}
$("#addUniBtn").onclick=()=>openUniModal(null);$("#uniClose").onclick=closeUni;$("#uniCancel").onclick=closeUni;
$("#uniOverlay").addEventListener("click",e=>{if(e.target===$("#uniOverlay"))closeUni();});
$("#uniSave").onclick=async()=>{
  if(!sb){toast("Database not connected");return;}
  const name=$("#mName").value.trim();if(!name){toast("University name is required");return;}
  const reqs=$("#mReqs").value.split("\n").map(x=>x.trim()).filter(Boolean);
  const data={name,program:$("#mProg").value.trim(),country:$("#mCountry").value.trim(),degree:$("#mDeg").value,open_date:$("#mOpen").value||null,close_date:$("#mClose").value||null,intake:$("#mIntake").value.trim(),tuition:$("#mTuition").value.trim(),ielts:$("#mIelts").value.trim(),priority:$("#mPrio").value,eligibility:$("#mElig").value,requirements:reqs,link:$("#mLink").value.trim(),updated_at:new Date().toISOString()};
  if(editId){const u=unis.find(x=>x.id===editId);Object.assign(u,data);renderUnis();updateStats();const{error}=await sb.from("programs").update(data).eq("id",editId);if(error){toast("Couldn't save: "+error.message);return;}toast("Program updated");}
  else{const row=Object.assign({id:"u-"+Date.now().toString(36),status:"not_started",notes:"",docs:{},req_done:{},verify:false,created_at:Date.now()},data);const{error}=await sb.from("programs").insert(row);if(error){toast("Couldn't save: "+error.message);return;}unis.push(row);renderAll();toast("Program added");}
  closeUni();
};

/* ============ sch modal ============ */
function openSchModal(){["#sName","#sCountry","#sCover","#sOpen","#sDeadline","#sLink"].forEach(id=>$(id).value="");$("#schOverlay").classList.add("open");}
function closeSch(){$("#schOverlay").classList.remove("open");}
$("#addSchBtn").onclick=openSchModal;$("#schClose").onclick=closeSch;$("#schCancel").onclick=closeSch;
$("#schOverlay").addEventListener("click",e=>{if(e.target===$("#schOverlay"))closeSch();});
$("#schSave").onclick=async()=>{
  if(!sb){toast("Database not connected");return;}
  const name=$("#sName").value.trim();if(!name){toast("Scholarship name is required");return;}
  const row={id:"s-"+Date.now().toString(36),name,country:$("#sCountry").value.trim(),cover:$("#sCover").value.trim(),open_date:$("#sOpen").value||null,deadline:$("#sDeadline").value||null,link:$("#sLink").value.trim(),status:"not_started",verify:false,created_at:Date.now()};
  const{error}=await sb.from("scholarships").insert(row);if(error){toast("Couldn't save: "+error.message);return;}schols.push(row);renderAll();toast("Scholarship added");closeSch();
};

/* ============ realtime (optional) ============ */
function startRealtime(){
  if(!sb||!sb.channel)return;
  try{
    sb.channel("st-rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"programs"},()=>refetch("programs"))
      .on("postgres_changes",{event:"*",schema:"public",table:"scholarships"},()=>refetch("scholarships"))
      .subscribe();
  }catch(e){}
}
let rtT;
function refetch(){clearTimeout(rtT);rtT=setTimeout(()=>loadAll(),400);}

/* ============ boot ============ */
renderAll();renderIcons();
loadAll().then(()=>{seedProfileIfEmpty();startRealtime();});
</script>
</body>
