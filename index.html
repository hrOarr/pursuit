<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pursuit</title>
<meta name="description" content="Chart your path to studying abroad — track Masters & PhD applications and scholarships.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e7ebf1;
  --border:#e2e7ee; --border-strong:#ccd4df;
  --fg:#181d26; --fg-2:#56606f; --muted:#8a93a2;
  --accent:#1e64f0; --accent-fg:#ffffff; --accent-soft:rgba(30,100,240,.10);
  --accent-2:#dd8f33; --accent-2-bg:rgba(221,143,51,.14);
  --ok:#1f9d6b; --ok-bg:rgba(31,157,107,.12);
  --warn:#bd7710; --warn-bg:rgba(189,119,16,.13);
  --bad:#d2483f; --bad-bg:rgba(210,72,63,.12);
  --info:#2f6fd0; --info-bg:rgba(47,111,208,.12);
  --applied:#6d5ae0; --applied-bg:rgba(109,90,224,.13);
  --slate:#6b7280; --slate-bg:rgba(107,114,128,.12);
  --orange:#d9772e; --orange-bg:rgba(217,119,46,.13);
  --shadow:0 1px 2px rgba(20,28,40,.04),0 2px 8px rgba(20,28,40,.05);
  --shadow-lg:0 8px 30px rgba(20,28,40,.14);
  --radius:14px; --radius-sm:9px;
  --font-head:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b23; --surface-2:#1d232d; --surface-3:#242b36;
  --border:#262d39; --border-strong:#39424f;
  --fg:#e9ecf1; --fg-2:#a6afbd; --muted:#717b8a;
  --accent:#6f9bff; --accent-fg:#0b1220; --accent-soft:rgba(111,155,255,.16);
  --accent-2:#f0b45e; --accent-2-bg:rgba(240,180,94,.16);
  --ok:#3bbd87; --ok-bg:rgba(59,189,135,.15);
  --warn:#e0a44a; --warn-bg:rgba(224,164,74,.15);
  --bad:#ef6b61; --bad-bg:rgba(239,107,97,.15);
  --info:#5b9af0; --info-bg:rgba(91,154,240,.15);
  --applied:#9b8bf0; --applied-bg:rgba(155,139,240,.16);
  --slate:#9aa3b2; --slate-bg:rgba(154,163,178,.15);
  --orange:#eb9a5a; --orange-bg:rgba(235,154,90,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 10px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b23; --surface-2:#1d232d; --surface-3:#242b36;
  --border:#262d39; --border-strong:#39424f;
  --fg:#e9ecf1; --fg-2:#a6afbd; --muted:#717b8a;
  --accent:#6f9bff; --accent-fg:#0b1220; --accent-soft:rgba(111,155,255,.16);
  --accent-2:#f0b45e; --accent-2-bg:rgba(240,180,94,.16);
  --ok:#3bbd87; --ok-bg:rgba(59,189,135,.15);
  --warn:#e0a44a; --warn-bg:rgba(224,164,74,.15);
  --bad:#ef6b61; --bad-bg:rgba(239,107,97,.15);
  --info:#5b9af0; --info-bg:rgba(91,154,240,.15);
  --applied:#9b8bf0; --applied-bg:rgba(155,139,240,.16);
  --slate:#9aa3b2; --slate-bg:rgba(154,163,178,.15);
  --orange:#eb9a5a; --orange-bg:rgba(235,154,90,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 10px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
/* IH-style sidebar shell */
.app{display:flex;align-items:flex-start;min-height:100vh}
.side{width:234px;flex-shrink:0;align-self:stretch;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px;gap:6px;z-index:20}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.side-brand h1{font-size:19px;font-weight:600}
.side-nav{display:flex;flex-direction:column;gap:3px}
.side-nav .tab{display:flex;align-items:center;gap:11px;padding:9px 11px;border:none;border-bottom:none;background:none;color:var(--fg-2);font-size:14px;font-weight:500;text-align:left;width:100%;border-radius:9px;margin:0;white-space:nowrap}
.side-nav .tab .ti{font-size:18px}
.side-nav .tab:hover{background:var(--surface-2);color:var(--fg)}
.side-nav .tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600;border-bottom:none}
.side-nav .tab .cnt{margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--fg-2);border-radius:999px;padding:1px 8px;font-weight:600}
.side-nav .tab.on .cnt{background:var(--accent);color:var(--accent-fg);margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--border)}
.side-foot .chip-user{width:100%}
.side-foot-btns{display:flex;gap:8px}
.main{flex:1;min-width:0}
.main .wrap{max-width:1280px;margin:0;padding-top:6px}
#detailView{padding-top:4px}
.uni.dv{border-left-width:4px;padding:16px 18px;overflow:visible;cursor:default}
.uni.dv:hover{transform:none;box-shadow:var(--shadow)}
.dv-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.dv-head{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.dv-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dv-title h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.dv-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.dv-main{min-width:0}
.dv-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.dv-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.dv-meta{font-size:13px}
.dv-status{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:8px;font-weight:600;margin-top:4px}
.dv-actions{display:flex;gap:8px}
.dv-actions .btn{flex:1;justify-content:center}
.danger-btn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--border))}
.danger-btn:hover{background:var(--bad-bg)}
@media (max-width:760px){.dv-grid{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;gap:8px;padding:9px 10px;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side-brand{padding:0;flex-shrink:0}
  .side-brand h1{display:none}
  .side-nav{flex-direction:row;gap:4px}
  .side-nav .tab{width:auto;padding:7px 11px}
  .side-foot{margin-top:0;flex-direction:row;border-top:none;padding-top:0;margin-left:auto;flex-shrink:0}
  .side-foot .chip-user{display:none!important}
}
.tnum{font-variant-numeric:tabular-nums}
.ti{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;line-height:1;flex-shrink:0;vertical-align:-.125em}
.ti svg{width:1em;height:1em;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.ti-loader svg{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.ti-loader svg{animation:none}}

.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--accent),var(--applied));display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:19px;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 45%,transparent)}
.brand h1{font-size:18px;font-weight:600;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.top-sp{flex:1}
.chip-user{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.chip-user .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:11px;font-family:var(--font-head)}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg-2);display:grid;place-items:center;font-size:17px}
.icon-btn:hover{color:var(--fg);border-color:var(--border-strong)}

.dash{padding-top:18px}
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:8px}
.stat{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.stat .chip{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.stat .chip .ti{font-size:16px}
.stat .v{font-family:var(--font-head);font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1}
.stat .k{font-size:11.5px;font-weight:500;color:var(--fg-2)}
.stat .vsub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-5px}
.stat.hl{background:radial-gradient(130% 120% at 100% 0,var(--accent-2-bg),transparent 55%);border-color:color-mix(in srgb,var(--accent-2) 38%,var(--border))}
.stat.hl .chip{background:var(--accent-2-bg);color:var(--accent-2)}
.stat.hl .v{color:var(--accent-2)}

.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;background:none;border:none;border-bottom:2px solid transparent;color:var(--fg-2);font-size:14px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px;margin-bottom:-1px}
.tab .ti{font-size:17px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{font-size:11px;background:var(--surface-3);color:var(--fg-2);border-radius:999px;padding:1px 7px;font-weight:600}
.tab.on .cnt{background:var(--accent-soft);color:var(--accent)}

.panel{padding:18px 0 60px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border:none;background:none;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
select.ctl,input.ctl{font-family:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);border-radius:9px}
select.ctl:focus,input.ctl:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.ctl-sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-size:13px;font-weight:600}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn .ti{font-size:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:13px}
.uni{position:relative;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--rail,var(--accent));border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s ease,transform .18s ease}
.uni:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.uni{transition:none}.uni:hover{transform:none}}
.uni-top{padding:14px 15px 12px;display:flex;flex-direction:column;gap:9px}
.uni-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.flag{font-size:12px;font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:6px;letter-spacing:.02em;flex-wrap:wrap}
.flag .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.uni h3{font-size:16px;font-weight:600;line-height:1.25}
.uni .prog{font-size:13px;color:var(--fg-2);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;letter-spacing:.01em}
.pill-slate{background:var(--slate-bg);color:var(--slate)} .pill-info{background:var(--info-bg);color:var(--info)}
.pill-warn{background:var(--warn-bg);color:var(--warn)} .pill-applied{background:var(--applied-bg);color:var(--applied)}
.pill-ok{background:var(--ok-bg);color:var(--ok)} .pill-bad{background:var(--bad-bg);color:var(--bad)}
.pill-orange{background:var(--orange-bg);color:var(--orange)}
.win{display:flex;gap:0;padding:0 15px 12px}
.win-cell{flex:1;min-width:0}
.win-cell .wl{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:4px}
.win-cell .wv{font-size:13px;font-weight:600;margin-top:2px}
.win-div{width:1px;background:var(--border);margin:2px 14px}
.flagchip{font-size:15px;line-height:1}
.runway-wrap{padding:3px 15px 13px;display:flex;flex-direction:column;gap:7px}
.runway-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rw-date{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rw-status{font-size:12px;font-weight:600;white-space:nowrap}
.runway{position:relative;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.runway-fill{position:absolute;top:0;bottom:0;left:0;border-radius:999px;min-width:3px;transition:width .4s ease}
@media (prefers-reduced-motion:reduce){.runway-fill{transition:none}}
.rw-urgent .rw-status{color:var(--bad)} .rw-urgent .runway-fill{background:var(--bad)}
.rw-soon .rw-status{color:var(--warn)} .rw-soon .runway-fill{background:var(--warn)}
.rw-open .rw-status{color:var(--ok)} .rw-open .runway-fill{background:var(--ok)}
.rw-upcoming .rw-status{color:var(--info)} .rw-upcoming .runway-fill{background:var(--info);opacity:.55}
.rw-closed .rw-status{color:var(--muted)} .rw-closed .runway-fill{background:var(--muted)}
.rw-none .rw-status{color:var(--muted)} .rw-none .runway-fill{background:transparent}
.metarow{display:flex;flex-wrap:wrap;gap:4px 16px;padding:0 15px 13px}
.meta{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:5px}
.meta .ti{font-size:14px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.dl-soon{color:var(--bad)} .dl-near{color:var(--warn)} .dl-ok{color:var(--fg-2)} .dl-open{color:var(--ok)}
.uni-foot{margin-top:auto;border-top:1px solid var(--border);display:flex;align-items:stretch;background:var(--surface-2)}
.uni-foot select{flex:1;border:none;background:none;color:var(--fg);font-family:inherit;font-size:12.5px;font-weight:600;padding:10px 12px}
.uni-foot select:focus{outline:2px solid var(--accent-soft);outline-offset:-2px}
.foot-btn{border:none;border-left:1px solid var(--border);background:none;color:var(--fg-2);padding:0 13px;font-size:16px;display:grid;place-items:center}
.foot-btn:hover{color:var(--fg);background:var(--surface-3)}
.foot-btn.danger:hover{color:var(--bad)}
.verify{font-size:10.5px;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:999px;font-weight:600}

.detail{border-top:1px solid var(--border);padding:13px 15px;display:none;flex-direction:column;gap:13px;background:var(--surface)}
.detail.open{display:flex}
.lbl-mini{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.detail-grid{display:flex;flex-direction:column;gap:7px}
.elig-note{font-size:12.5px;color:var(--fg-2);line-height:1.5}
.apptrack{display:flex;align-items:center;gap:10px;padding-top:1px}
.segs{display:flex;gap:3px;flex:1;min-width:0}
.seg{height:5px;flex:1;border-radius:999px;background:var(--surface-3);transition:background .2s ease}
.seg.on{background:var(--accent)}
.apptrack-lbl{font-size:11px;color:var(--fg-2);font-weight:600;white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg-2);font-size:13px;font-weight:500;width:100%;text-align:left;cursor:pointer}
.step:hover{border-color:var(--border-strong)}
.step-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);font-size:13px;flex-shrink:0}
.step-ic .ti{font-size:13px}
.step.done{background:var(--ok-bg);border-color:transparent;color:var(--fg)}
.step.done .step-ic{background:var(--ok);color:#fff}
.seg.part{background:color-mix(in srgb,var(--accent) 45%,var(--surface-3))}
.uni-meta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.dmeta{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2)}
.dmeta .ti{font-size:14px;color:var(--muted)}
.ddot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dsep{color:var(--border-strong);font-weight:400}
.urg-urgent{color:var(--bad);font-weight:600} .urg-urgent .ddot{background:var(--bad)}
.urg-soon{color:var(--warn);font-weight:600} .urg-soon .ddot{background:var(--warn)}
.urg-open{color:var(--ok);font-weight:600} .urg-open .ddot{background:var(--ok)}
.urg-upcoming{color:var(--info);font-weight:600} .urg-upcoming .ddot{background:var(--info)}
.urg-closed{color:var(--muted);font-weight:600} .urg-closed .ddot{background:var(--muted)}
.urg-none{color:var(--muted);font-weight:600} .urg-none .ddot{background:var(--muted)}
.stages{display:flex;flex-direction:column;gap:6px}
.stg{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.stg-h{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;background:none;border:none;color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.stg-h:hover{background:var(--surface-3)}
.stg-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);flex-shrink:0}
.stg-ic .ti{font-size:14px}
.stg-t{flex:1;min-width:0}
.stg-x{font-size:11.5px;color:var(--fg-2);font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.stg-chev{color:var(--muted);display:inline-flex;font-size:14px}
.stg.part .stg-ic{background:var(--accent-soft);color:var(--accent)}
.stg.done{background:var(--ok-bg)}
.stg.done .stg-ic{background:var(--ok);color:#fff}
.stg.done .stg-x{color:var(--ok);border-color:transparent;background:color-mix(in srgb,var(--ok) 14%,transparent)}

/* Persist the pipeline inside the always-present `docs` jsonb column, so progress
   survives a refresh even when the optional standalone `pipeline` column was never added. */
function savePipeline(id,pl,extra){
  const u=unis.find(x=>x.id===id)||{};
  const docs=Object.assign({},(u.docs&&typeof u.docs==="object")?u.docs:{},{pipeline:pl});
  writeUni(id,Object.assign({docs},extra||{}));
}
function stageDone(st){return st.items.length>0&&st.items.every(i=>i.done);}
function stageAny(st){return st.items.some(i=>i.done);}
function firstIncomplete(pl){const i=pl.findIndex(st=>!stageDone(st));return i<0?pl.length-1:i;}
function clonePipeline(u){return getPipeline(u).map(st=>({id:st.id,t:st.t,items:st.items.map(it=>({id:it.id,t:it.t,done:!!it.done}))}));}
function appProgress(u){const pl=getPipeline(u);let done=0,current="",found=false;for(const st of pl){if(stageDone(st))done++;else if(!found){current=st.t;found=true;}}return{done,total:pl.length,current:found?current:"All stages complete"};}

async function loadAll(isManual){
  if(!sb){showNote("Supabase client couldn't load. Check your internet connection and refresh.",true);renderAll();return;}
  if(isManual)toast("Refreshing…");
  try{
    const [p,s,pr]=await Promise.all([
      sb.from("programs").select("*"),
      sb.from("scholarships").select("*"),
      sb.from("profile").select("*"),
    ]);
    if(p.error)throw p.error;
    if(s.error)throw s.error;
    unis=p.data||[]; schols=s.data||[];
    const prows=(pr&&pr.data)?pr.data:[];
    profile=(prows.find(r=>r.id==="me")||{}).data||null;
    analysis=(prows.find(r=>r.id==="analysis")||{}).data||null;
    loaded=true; hideNote(); renderAll();
    if(profile&&profile.name){$("#userName").textContent=String(profile.name).split(" ")[0];$("#userAv").textContent=(profile.name[0]||"A").toUpperCase();$("#userChip").hidden=false;}
    if(isManual)toast("Up to date");

    loaded=true;

    if(/relation|does not exist|schema cache|not find the table/i.test(m)) showNote("Database tables not found. Run supabase_setup.sql in your Supabase SQL editor, then refresh.",true);
    else showNote("Couldn't reach the database: "+m,true);

  }
}

// Curated columns the recommended catalog owns. User columns (status, notes,
// docs/pipeline progress, req_done) are deliberately excluded so a sync never

const CURATED_FIELDS=["id","country","cc","name","program","degree","tuition","open_date","close_date","intake","ielts","eligibility","elig_note","requirements","link","priority","verify"];
async function importCatalog(){
  if(!sb){toast("Database not connected");return;}

  btns.forEach(b=>{b.disabled=true;b.dataset._h=b.innerHTML;b.innerHTML='<i class="ti ti-loader"></i>Syncing…';renderIcons(b);});
  const existing=new Set(unis.map(u=>u.id));
  const rows=CATALOG.map(c=>{const r={};CURATED_FIELDS.forEach(k=>{r[k]=(k in c)?c[k]:null;});return r;});
  const{error}=await sb.from("programs").upsert(rows,{onConflict:"id"});
  btns.forEach(b=>{b.disabled=false;if(b.dataset._h){b.innerHTML=b.dataset._h;delete b.dataset._h;}renderIcons(b);});
  if(error){toast("Sync failed: "+error.message);}
  else{const added=CATALOG.filter(c=>!existing.has(c.id)).length;toast(added?("Synced — "+added+" new program"+(added>1?"s":"")+" added"):"Synced — all programs up to date");await loadAll();}
}

/* ============ helpers ============ */
function daysLeft(d){if(!d)return null;const t=new Date(d+"T00:00:00");const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function fmtDate(d){if(!d)return "—";const dt=new Date(d+"T00:00:00");if(isNaN(dt))return "—";return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
function closeClass(n){if(n==null)return "dl-ok";if(n<0)return "dl-soon";if(n<=30)return "dl-soon";if(n<=75)return "dl-near";return "dl-ok";}
function closeText(n){if(n==null)return "No date";if(n<0)return "Closed";if(n===0)return "Closes today";return "Closes in "+n+"d";}
function openText(n){if(n==null)return "";if(n>0)return "Opens in "+n+"d";return "Open now";}
const COUNTRY={"Austria":{f:"🇦🇹",c:"#d6453f"},"Netherlands":{f:"🇳🇱",c:"#e8820c"},"Finland":{f:"🇫🇮",c:"#4a7fe0"},"Sweden":{f:"🇸🇪",c:"#d9a521"},"USA":{f:"🇺🇸",c:"#3b5bd0"},"Canada":{f:"🇨🇦",c:"#e0564f"},"Hungary":{f:"🇭🇺",c:"#2f9e6b"},"Australia":{f:"🇦🇺",c:"#15887a"},"EU-wide":{f:"🇪🇺",c:"#6366e0"},"Germany":{f:"🇩🇪",c:"#556070"}};
function countryMeta(name){return COUNTRY[name]||{f:"🌍",c:"var(--accent)"};}
function winProgress(p){
  const o=daysLeft(p.open_date),c=daysLeft(p.close_date);
  if(c==null)return{pct:0,state:"none",label:"No deadline set"};
  if(c<0)return{pct:100,state:"closed",label:"Closed"};
  if(o!=null&&o>0)return{pct:4,state:"upcoming",label:"Opens in "+o+"d"};
  let pct;
  if(p.open_date&&p.close_date){
    const ot=new Date(p.open_date+"T00:00:00").getTime(),ct=new Date(p.close_date+"T00:00:00").getTime(),now=Date.now();
    pct=ct>ot?Math.round(((now-ot)/(ct-ot))*100):60;
  }else{ pct=c<=7?90:c<=30?72:c<=75?46:24; }
  pct=Math.max(5,Math.min(97,pct));
  const state=c<=14?"urgent":c<=45?"soon":"open";
  return{pct,state,label:(c===0?"Closes today":"Closes in "+c+"d")};
}

function sortUnis(list){
  const s=$("#fSort").value,arr=[...list];
  const byDate=f=>(a,b)=>{const x=daysLeft(a[f]),y=daysLeft(b[f]);if(x==null)return 1;if(y==null)return -1;return x-y;};
  if(s==="deadline")arr.sort(byDate("close_date"));
  else if(s==="opening")arr.sort(byDate("open_date"));
  else if(s==="priority"){const o={high:0,medium:1,low:2};arr.sort((a,b)=>(o[a.priority]??3)-(o[b.priority]??3));}
  else if(s==="country")arr.sort((a,b)=>(a.country||"").localeCompare(b.country||"")||(a.name||"").localeCompare(b.name||""));
  else if(s==="status")arr.sort((a,b)=>UNI_STATUS_ORDER.indexOf(a.status)-UNI_STATUS_ORDER.indexOf(b.status));
  else if(s==="name")arr.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  return arr;
}

function onCardChange(e){const card=e.target.closest(".uni");if(!card)return;const id=card.dataset.id;const u=unis.find(x=>x.id===id)||{};
  if(e.target.matches("[data-status]")){const v=e.target.value;writeUni(id,{status:v,applied_date:(v==="applied"&&!u.applied_date)?new Date().toISOString().slice(0,10):(u.applied_date||null)});toast("Status updated");return;}}
function onCardInput(e){if(!e.target.matches("[data-note]"))return;const card=e.target.closest(".uni");const id=card.dataset.id,val=e.target.value;clearTimeout(noteTimers[id]);noteTimers[id]=setTimeout(()=>{writeUni(id,{notes:val});toast("Notes saved");},700);}
function addCriterion(card,id,u,si){const inp=card.querySelector('[data-additem="'+si+'"]');const v=(inp&&inp.value||"").trim();if(!v)return;const pl=clonePipeline(u);if(pl[si])pl[si].items.push({id:uid(),t:v,done:false});savePipeline(id,pl);}
function inlineRename(spanEl,id,kind){const u=unis.find(x=>x.id===id)||{};const ds=spanEl.dataset;const input=document.createElement("input");input.className="inline-edit";input.value=spanEl.textContent;spanEl.replaceWith(input);input.focus();input.select();let fin=false;
  const save=(commit)=>{if(fin)return;fin=true;const v=input.value.trim();if(!commit||!v){renderActive();return;}const pl=clonePipeline(u);
    if(kind==="stage"){const si=+ds.renamestage;if(pl[si])pl[si].t=v;}else{const a=ds.rename.split(":").map(Number);if(pl[a[0]]&&pl[a[0]].items[a[1]])pl[a[0]].items[a[1]].t=v;}
    savePipeline(id,pl);};
  input.addEventListener("blur",()=>save(true));
  input.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();save(true);}else if(ev.key==="Escape"){save(false);}});}
function reopenCards(){}
function renderActive(){if(view==="detail"&&detailId&&unis.find(u=>u.id===detailId)){renderDetail();}else{renderUnis();}}
function openDetail(id){detailId=id;view="list";view="detail";$("#listRoot").hidden=true;$("#detailView").hidden=false;window.scrollTo(0,0);renderDetail();}
function closeDetail(){view="list";detailId=null;$("#detailView").hidden=true;$("#detailView").innerHTML="";$("#listRoot").hidden=false;}
function pipeNodes(u,pl,sel){return pl.map((s2,si)=>{const d=stageDone(s2),a=stageAny(s2);return `${si?'<span class="pconn'+(d?" on":"")+'"></span>':""}<button class="pnode ${d?"done":a?"run":"pend"}${si===sel?" sel":""}" data-pnode="${si}"><span class="pn-ic"><i class="ti ti-${d?"check":a?"loader":"circle"}"></i></span><span class="pn-t">${esc(s2.t)}</span><span class="pn-x">${s2.items.filter(i=>i.done).length}/${s2.items.length}</span></button>`;}).join("")+'<button class="pnode addstage" data-addstage title="Add stage"><span class="pn-ic"><i class="ti ti-plus"></i></span><span class="pn-t">Add stage</span></button>';}
function pcritHtml(cur,sel){return `<div class="pcrit"><div class="pcrit-head"><span class="pcrit-t" data-renamestage="${sel}" title="Click to rename">${esc(cur.t)}</span><button class="pcrit-del" data-delstage="${sel}" title="Delete stage"><i class="ti ti-trash"></i></button></div><div class="pitems">${cur.items.map((it,ii)=>`<div class="sitem${it.done?" on":""}"><button class="sitem-box" data-check="${sel}:${ii}"><i class="ti ti-check"></i></button><span class="sitem-t" data-rename="${sel}:${ii}" title="Click to rename">${esc(it.t)}</span><button class="sitem-x" data-delitem="${sel}:${ii}" title="Remove"><i class="ti ti-x"></i></button></div>`).join("")}${cur.items.length?"":'<div class="pitems-empty">No criteria yet — add the first one below.</div>'}</div><div class="additem"><input class="additem-in" data-additem="${sel}" placeholder="Add a criterion…" autocomplete="off"><button class="btn additem-btn" data-additembtn="${sel}"><i class="ti ti-plus"></i>Add</button></div></div>`;}
function renderDetail(){
  const u=unis.find(x=>x.id===detailId);if(!u){closeDetail();renderUnis();return;}
  const cm=countryMeta(u.country), wp=winProgress(u), ap=appProgress(u), pl=getPipeline(u);
  const st=STATUS[u.status]||STATUS.not_started, el=ELIG[u.eligibility]||ELIG.match;
  const statusOpts=UNI_STATUS_ORDER.map(k=>`<option value="${k}"${u.status===k?" selected":""}>${STATUS[k].label}</option>`).join("");
  const sel=(selStage[u.id]!=null&&selStage[u.id]<pl.length)?selStage[u.id]:firstIncomplete(pl);
  const cur=pl[sel]||pl[0]||{t:"",items:[]};
  const dateline=u.close_date?`${wp.label} <span class="dsep">·</span> ${fmtDate(u.close_date)}`:wp.label;
  $("#detailView").innerHTML=`<div class="uni dv" data-id="${esc(u.id)}" style="--rail:${cm.c}">
    <button class="dv-back" data-back><i class="ti ti-arrow-left"></i>All programs</button>
    <div class="dv-head">
      <div class="flag"><span class="flagchip">${cm.f}</span>${esc(u.country||"")}${u.intake?` · ${esc(u.intake)}`:""}${u.verify?' <span class="verify">verify</span>':""}</div>
      <div class="dv-title"><h2>${esc(u.name||"")}</h2><span class="bdg ${st.cls}">${st.label}</span></div>
      <div class="prog">${esc(u.program||"")}</div>
      <div class="badges"><span class="bdg ${el.cls}"><i class="ti ti-${el.ti}"></i>${el.label}</span><span class="bdg ${(PRIO[u.priority]||PRIO.medium).cls}">${(PRIO[u.priority]||PRIO.medium).label} priority</span><span class="bdg pill-slate">${esc(u.degree||"Masters")}</span></div>
    </div>
    <div class="dv-grid">
      <div class="dv-main">
        <div class="apptrack" style="margin-bottom:14px"><div class="segs">${pl.map(s2=>`<span class="seg${stageDone(s2)?" on":stageAny(s2)?" part":""}"></span>`).join("")}</div><span class="apptrack-lbl">${ap.done}/${ap.total} stages${ap.done===ap.total?"":" · "+esc(ap.current)}</span></div>
        <span class="lbl-mini">Application pipeline</span>
        <div class="pipeline">${pipeNodes(u,pl,sel)}</div>
        ${pcritHtml(cur,sel)}
      </div>
      <aside class="dv-side">
        <div class="dv-card">
          <div class="dv-meta"><span class="dmeta urg-${wp.state}"><span class="ddot"></span>${dateline}</span></div>
          <div class="dv-meta"><span class="dmeta"><i class="ti ti-calendar-up"></i>Opens ${fmtDate(u.open_date)}</span></div>
          <div class="dv-meta"><span class="dmeta"><i class="ti ti-cash"></i>${esc(u.tuition||"—")}</span></div>
          <div class="dv-meta"><span class="dmeta"><i class="ti ti-language"></i>IELTS ${esc(u.ielts||"—")}</span></div>
          <select class="dv-status" data-status>${statusOpts}</select>
        </div>
        ${u.elig_note?`<div class="dv-card"><span class="lbl-mini">Why this fit</span><div class="elig-note">${esc(u.elig_note)}</div></div>`:""}
        <div class="dv-card"><span class="lbl-mini">Notes</span><textarea class="note-area" data-note placeholder="Portal login, supervisor emails, to-dos…">${esc(u.notes||"")}</textarea></div>
        ${u.link?`<a class="applink" href="${esc(u.link)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Open application page</a>`:""}
        <div class="dv-actions"><button class="btn" data-edit><i class="ti ti-pencil"></i>Edit details</button><button class="btn danger-btn" data-del><i class="ti ti-trash"></i>Delete</button></div>
      </aside>
    </div>
  </div>`;
  renderIcons($("#detailView"));
}
["#uniHost","#detailView"].forEach(sel=>{const n=$(sel);if(!n)return;n.addEventListener("click",onCardClick);n.addEventListener("keydown",onCardKeydown);n.addEventListener("change",onCardChange);n.addEventListener("input",onCardInput);});

/* ============ scholarships ============ */
function renderSchols(){
  const host=$("#schHost");
  if(!loaded){host.innerHTML='<div class="grid">'+Array(3).fill('<div class="skel"></div>').join("")+"</div>";return;}
  if(!schols.length){host.innerHTML=`<div class="empty"><i class="ti ti-award"></i><h3>No scholarships yet</h3><p>Load a starter set matched to your target countries — OeAD, Erasmus Mundus, Stipendium Hungaricum and more.</p><button class="btn primary" id="importSchBtn"><i class="ti ti-download"></i>Import recommended scholarships</button></div>`;const b=$("#importSchBtn");if(b)b.onclick=importSchCatalog;renderIcons(host);return;}
  const cQ=$("#fSchCountry").value,sQ=$("#fSchStatus").value;
  let list=schols.filter(s=>(cQ==="all"||s.country===cQ)&&(sQ==="all"||(s.status||"not_started")===sQ));
  list.sort((a,b)=>{const x=daysLeft(a.deadline),y=daysLeft(b.deadline);if(x==null)return 1;if(y==null)return -1;return x-y;});
  if(!list.length){host.innerHTML=`<div class="empty"><i class="ti ti-filter-off"></i><h3>Nothing matches</h3><p>No scholarships match these filters.</p></div>`;renderIcons(host);return;}
  host.innerHTML='<div class="grid">'+list.map(schCard).join("")+"</div>";renderIcons(host);
}
function schCard(s){
  const st=SCH_STATUS[s.status||"not_started"];
  const cm=countryMeta(s.country), wp=winProgress({open_date:s.open_date,close_date:s.deadline});
  const opts=Object.keys(SCH_STATUS).map(k=>`<option value="${k}"${(s.status||"not_started")===k?" selected":""}>${SCH_STATUS[k].label}</option>`).join("");
  return `<div class="sch" data-id="${esc(s.id)}" style="--rail:${cm.c}">
    <div class="uni-head"><div style="min-width:0"><div class="flag"><span class="flagchip">${cm.f}</span>${esc(s.country||"")}${s.verify?' <span class="verify">verify</span>':""}</div><h3 style="font-size:15.5px;margin-top:4px">${esc(s.name||"")}</h3></div><span class="bdg ${st.cls}">${st.label}</span></div>
    <div class="sch-cover">${esc(s.cover||"")}</div>
    <div class="runway-wrap rw-${wp.state}" style="padding-left:0;padding-right:0">
      <div class="runway-head">
        <span class="rw-date">${s.open_date?("Opens "+fmtDate(s.open_date)):" "}</span>
        <span class="rw-status">${wp.label}</span>
        <span class="rw-date">${s.deadline?("Deadline "+fmtDate(s.deadline)):""}</span>
      </div>
      <div class="runway"><div class="runway-fill" style="width:${wp.pct}%"></div></div>
    </div>
    ${s.link?`<a class="applink" href="${esc(s.link)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Scholarship page</a>`:""}
    <div class="sch-foot"><select data-sstatus>${opts}</select><button class="foot-btn danger" data-sdel title="Remove" style="border:1px solid var(--border);border-radius:8px;height:34px;width:38px"><i class="ti ti-trash"></i></button></div>
  </div>`;
}
$("#schHost").addEventListener("change",e=>{const card=e.target.closest(".sch");if(!card)return;if(e.target.matches("[data-sstatus]")){writeSch(card.dataset.id,{status:e.target.value});toast("Updated");}});
$("#schHost").addEventListener("click",e=>{const card=e.target.closest(".sch");if(!card)return;if(e.target.closest("[data-sdel]"))delSch(card.dataset.id);});

/* ============ documents ============ */
function renderDocs(){
  $("#docHost").innerHTML=DOC_MASTER.map(d=>`<div class="doccard"><h3><i class="ti ti-${d.icon}" style="color:var(--accent)"></i>${esc(d.name)}</h3><p>${esc(d.desc)}</p></div>`).join("");
  renderIcons($("#docHost"));
}

/* ============ uni modal ============ */
let editId=null;
function openUniModal(u){
  editId=u?u.id:null;$("#uniModalTitle").textContent=u?"Edit program":"Add program";
  $("#mName").value=u?u.name||"":"";$("#mProg").value=u?u.program||"":"";$("#mCountry").value=u?u.country||"":"";
  $("#mDeg").value=u?u.degree||"Masters":"Masters";$("#mOpen").value=u?u.open_date||"":"";$("#mClose").value=u?u.close_date||"":"";
  $("#mIntake").value=u?u.intake||"":"";$("#mTuition").value=u?u.tuition||"":"";$("#mIelts").value=u?u.ielts||"":"";
  $("#mPrio").value=u?u.priority||"medium":"medium";$("#mElig").value=u?u.eligibility||"match":"match";
  $("#mReqs").value=u&&Array.isArray(u.requirements)?u.requirements.join("\n"):"";$("#mLink").value=u?u.link||"":"";
  $("#uniOverlay").classList.add("open");
}
function closeUni(){$("#uniOverlay").classList.remove("open");}
$("#addUniBtn").onclick=()=>openUniModal(null);{const sb2=$("#syncBtn");if(sb2)sb2.onclick=importCatalog;}$("#uniClose").onclick=closeUni;$("#uniCancel").onclick=closeUni;
$("#uniOverlay").addEventListener("click",e=>{if(e.target===$("#uniOverlay"))closeUni();});
$("#uniSave").onclick=async()=>{
  if(!sb){toast("Database not connected");return;}
  const name=$("#mName").value.trim();if(!name){toast("University name is required");return;}
  const reqs=$("#mReqs").value.split("\n").map(x=>x.trim()).filter(Boolean);
  const data={name,program:$("#mProg").value.trim(),country:$("#mCountry").value.trim(),degree:$("#mDeg").value,open_date:$("#mOpen").value||null,close_date:$("#mClose").value||null,intake:$("#mIntake").value.trim(),tuition:$("#mTuition").value.trim(),ielts:$("#mIelts").value.trim(),priority:$("#mPrio").value,eligibility:$("#mElig").value,requirements:reqs,link:$("#mLink").value.trim(),updated_at:new Date().toISOString()};
  if(editId){const u=unis.find(x=>x.id===editId);Object.assign(u,data);renderUnis();updateStats();const{error}=await sb.from("programs").update(data).eq("id",editId);if(error){toast("Couldn't save: "+error.message);return;}toast("Program updated");}
  else{const row=Object.assign({id:"u-"+Date.now().toString(36),status:"not_started",notes:"",docs:{},req_done:{},verify:false,created_at:Date.now()},data);const{error}=await sb.from("programs").insert(row);if(error){toast("Couldn't save: "+error.message);return;}unis.push(row);renderAll();toast("Program added");}
  closeUni();
};

/* ============ sch modal ============ */
function openSchModal(){["#sName","#sCountry","#sCover","#sOpen","#sDeadline","#sLink"].forEach(id=>$(id).value="");$("#schOverlay").classList.add("open");}
function closeSch(){$("#schOverlay").classList.remove("open");}
$("#addSchBtn").onclick=openSchModal;$("#schClose").onclick=closeSch;$("#schCancel").onclick=closeSch;
$("#schOverlay").addEventListener("click",e=>{if(e.target===$("#schOverlay"))closeSch();});
$("#schSave").onclick=async()=>{
  if(!sb){toast("Database not connected");return;}
  const name=$("#sName").value.trim();if(!name){toast("Scholarship name is required");return;}
  const row={id:"s-"+Date.now().toString(36),name,country:$("#sCountry").value.trim(),cover:$("#sCover").value.trim(),open_date:$("#sOpen").value||null,deadline:$("#sDeadline").value||null,link:$("#sLink").value.trim(),status:"not_started",verify:false,created_at:Date.now()};
  const{error}=await sb.from("scholarships").insert(row);if(error){toast("Couldn't save: "+error.message);return;}schols.push(row);renderAll();toast("Scholarship added");closeSch();
};

/* ============ realtime (optional) ============ */
function startRealtime(){
  if(!sb||!sb.channel)return;
  try{
    sb.channel("st-rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"programs"},()=>refetch("programs"))
      .on("postgres_changes",{event:"*",schema:"public",table:"scholarships"},()=>refetch("scholarships"))
      .subscribe();
  }catch(e){}
}
let rtT;
function refetch(){clearTimeout(rtT);rtT=setTimeout(()=>loadAll(),400);}

/* ============ boot ============ */
renderAll();renderIcons();
loadAll().then(()=>{seedProfileIfEmpty();startRealtime();});
</script>
