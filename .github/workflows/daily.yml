name: Daily sync

on:
  schedule:
    # 02:00 UTC daily  ==  08:00 Asia/Dhaka. Change the time by editing this.
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # run on demand from the Actions tab (use this after Claude pushes an override)

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependency
        run: npm install --no-save @supabase/supabase-js@2.45.4

      - name: Run daily sync (maintenance + overrides)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scheduler/analyze.mjs
